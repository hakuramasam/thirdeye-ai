# Pull requests and supported LTS lines are verified before a human accepts a change.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Node and npm runtime
        run: npm run check:runtime
      - name: Validate agent skill registry
        run: npm run validate:agent-skills
      - name: Dry-run agent competency harness
        run: npm run evaluate:agents
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Suite (PGlite, no DATABASE_URL)
        env:
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
        run: npm test
      - name: No credentials in the diff
        if: github.event_name == 'pull_request'
        run: |
          if git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | grep -nE '(sk-thirdeye-[A-Za-z0-9]{8,}|sk-(proj|ant)-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A credential-shaped string appears in this diff."; exit 1
          fi
          echo "clean"
