# The gate that makes agent pull requests safe to accept.
#
# The verify job checks types, PGlite behavior, and credential-shaped strings.
# The integration job additionally exercises the real PostgreSQL schema in a disposable
# Testcontainers instance. Testcontainers Cloud is opt-in for trusted main-branch pushes only.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Validate agent platform contracts
        run: npm run agent:platforms:check
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Suite (PGlite, no DATABASE_URL)
        env:
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
        run: npm test
      - name: No credentials in the diff
        run: |
          if git diff --unified=0 "origin/${{ github.base_ref || 'main' }}...HEAD" | grep -nE '(sk-thirdeye-[A-Za-z0-9]{8,}|sk-(proj|ant)-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo "::error::A credential-shaped string appears in this diff."; exit 1
          fi
          echo "clean"

  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Testcontainers PostgreSQL module
        run: npm install --no-save --package-lock=false --no-audit --no-fund @testcontainers/postgresql@12.2.2
      # Never expose the Cloud token to pull-request code. Enable the repository variable
      # TC_CLOUD_ENABLED=true only after storing TC_CLOUD_TOKEN as an Actions secret.
      - name: Setup Testcontainers Cloud
        if: github.event_name == 'push' && vars.TC_CLOUD_ENABLED == 'true'
        uses: atomicjar/testcontainers-cloud-setup-action@22064b87e13754258b1a686f4d93147f904c28d5
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}
          wait: true
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
