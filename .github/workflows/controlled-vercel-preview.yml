name: Controlled Vercel Preview

# Run from main only. Validate an exact feature-branch SHA, then build in GitHub
# Actions and upload the prebuilt output as a Preview deployment.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Feature branch to preview (not main)"
        required: true
        type: string
      sha:
        description: "Exact 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: controlled-vercel-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested ref and commit
        id: target
        shell: bash
        env:
          TARGET_REF: ${{ inputs.ref }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" == "main" ]] || ! git check-ref-format --branch "$TARGET_REF" >/dev/null 2>&1; then
            echo "::error::Choose a valid non-main feature branch."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full 40-character lowercase commit SHA."
            exit 1
          fi
          actual="$(git ls-remote https://github.com/hakuramasam/thirdeye-ai.git "refs/heads/$TARGET_REF" | awk '{print $1}')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::The supplied SHA is not the current head of the selected branch. Refresh the SHA and retry."
            exit 1
          fi
          echo "ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful GitHub checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/hakuramasam/thirdeye-ai/commits/$TARGET_SHA/check-runs" > /tmp/check-runs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('/tmp/check-runs.json', 'utf8'));
          const runs = data.check_runs ?? [];
          if (runs.length === 0) {
            console.error('No GitHub check runs found for this SHA; refusing to deploy.');
            process.exit(1);
          }
          const pending = runs.filter(x => x.status !== 'completed');
          const failed = runs.filter(x => x.status === 'completed' && x.conclusion !== 'success');
          if (pending.length || failed.length) {
            console.error(JSON.stringify({
              pending: pending.map(x => ({name:x.name,status:x.status})),
              unsuccessful: failed.map(x => ({name:x.name,conclusion:x.conclusion}))
            }, null, 2));
            process.exit(1);
          }
          console.log(`All ${runs.length} check run(s) completed successfully.`);
          NODE

      - name: Check out the exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Preview project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VXg8PosP0At3mMO3KY6ScI4s
          VERCEL_PROJECT_ID: prj_0t1NvQMOdZe4bL0q7lPBPIhA04bO
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview artifacts in GitHub Actions
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VXg8PosP0At3mMO3KY6ScI4s
          VERCEL_PROJECT_ID: prj_0t1NvQMOdZe4bL0q7lPBPIhA04bO
        run: |
          set -euo pipefail
          vercel build --token="$VERCEL_TOKEN"

      - name: Upload prebuilt artifacts as Preview only
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VXg8PosP0At3mMO3KY6ScI4s
          VERCEL_PROJECT_ID: prj_0t1NvQMOdZe4bL0q7lPBPIhA04bO
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --target=preview --yes --token="$VERCEL_TOKEN")"
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Vercel did not return a deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment created: $deployment_url"

      - name: Publish preview details
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "## ThirdEye AI Preview"
            echo ""
            echo "- **URL:** $DEPLOYMENT_URL"
            echo "- **Branch:** $TARGET_REF"
            echo "- **Commit:** $TARGET_SHA"
            echo "- **Environment:** Preview only; no production promotion."
            echo "- **Build:** Generated in GitHub Actions and uploaded with `vercel deploy --prebuilt`."
          } >> "$GITHUB_STEP_SUMMARY"
