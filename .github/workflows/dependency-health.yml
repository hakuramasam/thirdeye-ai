name: dependency-health
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record runtime and dependency health
        id: audit
        continue-on-error: true
        run: |
          node --version
          npm --version
          npm outdated --json > outdated.json || true
          npm audit --json > audit.json || true
          node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync('outdated.json','utf8')||'{}'); const a=JSON.parse(fs.readFileSync('audit.json','utf8')||'{}'); console.log(JSON.stringify({outdated:o,audit:a.metadata?.vulnerabilities||{}},null,2))" > dependency-health.txt
          cat dependency-health.txt
      - name: Upload dependency health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-${{ github.run_id }}
          path: |
            dependency-health.txt
            outdated.json
            audit.json
          if-no-files-found: ignore
      - name: Open/update maintenance issue when audit has findings
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated dependency health review required';
            const body = 'The scheduled dependency audit reported outdated or vulnerable packages. Inspect the latest dependency-health workflow artifact, prioritize security advisories, and propose upgrades in reviewable PRs. No automatic merge or deployment is permitted.\n\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const issues = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['dependencies'] });
