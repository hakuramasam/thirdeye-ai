name: Neon preview branch expiry

# Run from the trusted base branch. Never execute code from the PR being closed.
on:
  pull_request_target:
    types: [closed, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  set-preview-branch-expiry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm the PR is still closed and the branch is not in use
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventPr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: eventPr.number,
            });
            const openForBranch = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${eventPr.head.ref}`,
              per_page: 100,
            });
            const sameHead = current.data.head.sha === eventPr.head.sha;
            const stillClosed = current.data.state === 'closed';
            const branchInUse = openForBranch.some((pr) => pr.number !== eventPr.number);
            const action = stillClosed && sameHead && !branchInUse ? 'expire' : 'clear';
            core.setOutput('action', action);
            core.info(`Neon preview branch lifecycle action: ${action}`);
      - name: Apply lifecycle action to the exact Neon preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: shiny-scene-69417365
          NEON_BRANCH_NAME: preview/${{ github.event.pull_request.head.ref }}
          NEON_BRANCH_ACTION: ${{ steps.lifecycle.outputs.action }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::Add NEON_API_KEY as a GitHub Actions repository secret before relying on preview-branch expiry."
            exit 1
          fi
          node scripts/neon/expire-preview-branch.mjs
